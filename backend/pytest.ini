[pytest]
pythonpath = .
markers =
    unit: pure logic or fixtures only; no database, network, browser or model
    integration: exercises the API/DB/mock engine in-process; still fully offline
    live: needs a real browser, model or practice target; skipped unless selected (-m live)
    accuracy: runs the real scan graph offline against the accuracy corpus (tests/accuracy_corpus); skipped unless selected (-m accuracy)
