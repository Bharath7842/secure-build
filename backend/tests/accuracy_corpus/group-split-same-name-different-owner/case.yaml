id: group-split-same-name-different-owner
area: aggregation
polarity: positive
seed_findings: [62]
adjudication: dev_label_only
# A derived runtime-sink rule matches every `getPortID(` call. Same name, different
# owner and arity: the request message's zero-argument `xmlPortMsg.getPortID()` is
# not the DAO's `getPortID(String)`, so it is a different method (EPIC-02 identity
# check), and the DAO called with a constant carries no taint. Only the call that
# passes a caller's value stays a finding; the two declarations are dismissed
# structurally. (Before EPIC-02 the DAO bound its value, no rule could exist, and
# the message getter was wrongly scripted as the true positive.)
