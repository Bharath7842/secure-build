id: sqli-blamed-on-log-line
area: log-boundary
polarity: negative
seed_findings: [257]
adjudication: dev_label_only
# The model reports a SQL injection on a line that only logs a SQL-looking string.
# A log call cannot be a SQL sink, so the finding blames the wrong line and is
# dropped (and counted under publish_filter.logging_line_dropped).
allow_absent: true
expected: []
scripted:
  - step: scan_deep_files
    when_user_contains: ["OrderService.java"]
    response:
      findings:
        - line: 10
          verdict: true_positive
          confidence: 0.8
          rule_id: llm-extra
          severity: HIGH
          cwe: CWE-89
          title: SQL injection through a concatenated query string
          owasp_category: "A03:2021-Injection"
          source: id (method parameter)
          sink: log.debug
          data_flow: id is concatenated into a SELECT statement
          snippet: log.debug("select * from orders where id = " + id);
          verdict_reason: The id is concatenated into SQL text.
          ai_fix: Use a prepared statement.
