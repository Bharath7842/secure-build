id: token-purpose-refresh-as-access
area: auth-logic
polarity: positive
seed_findings: []
adjudication: dev_label_only
# A refresh token (long-lived, meant only for the refresh endpoint) signed with the same key and claims as an access token authenticates API calls: the filter reads only the subject. The issuing side is in JwtService, the validating side in JwtAuthFilter, so no single file shows it.
# The scripted answer is what a reviewer expects a model to say, so this case pins the pipeline
# (publish, filters, validators, grouping), not a model's recall.
state_overrides:
  deep_scan_batch_small_files: false
expected:
  - rule_id: llm-extra
    cwe: CWE-345
    file: src/main/java/com/acme/security/JwtAuthFilter.java
    sink_line: 21
    verdict: true_positive
scripted:
  - step: scan_deep_files
    when_user_contains: ["JwtAuthFilter.java"]
    response:
      findings:
        - line: 21
          file: src/main/java/com/acme/security/JwtAuthFilter.java
          verdict: true_positive
          confidence: 0.85
          rule_id: llm-extra
          severity: HIGH
          cwe: CWE-345
          title: "Refresh token accepted as an access token"
          owasp_category: "A07:2021-Identification-and-Authentication-Failures"
          source: "Authorization: Bearer token"
          sink: "setAuthentication(...)"
          data_flow: "generateRefreshToken signs the same claims and key as generateAccessToken, and the filter only verifies signature and expiry, so a 30-day refresh token authenticates API calls"
          snippet: "setAuthentication"
          verdict_reason: "Access and refresh tokens share one key and carry no type or purpose claim; subject() checks nothing but the signature, so the refresh token is accepted by the filter."
          ai_fix: "Add a token_use claim when issuing, and make the validator reject anything but \"access\" (and the refresh endpoint anything but \"refresh\")."
