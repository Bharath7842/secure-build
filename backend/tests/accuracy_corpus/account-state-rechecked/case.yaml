id: account-state-rechecked
area: auth-logic
polarity: negative
seed_findings: []
adjudication: dev_label_only
# Look-alike of account-state-locked-user-kept: the filter loads the user and refuses a locked one.
# The scripted answer is what a reviewer expects a model to say, so this case pins the pipeline
# (publish, filters, validators, grouping), not a model's recall.
state_overrides:
  deep_scan_batch_small_files: false
expected:
  - rule_id: llm-extra
    cwe: CWE-613
    file: src/main/java/com/acme/security/SessionAuthFilter.java
    sink_line: 25
    verdict: false_positive
scripted:
  - step: scan_deep_files
    when_user_contains: ["SessionAuthFilter.java"]
    response:
      findings:
        - line: 25
          file: src/main/java/com/acme/security/SessionAuthFilter.java
          verdict: false_positive
          confidence: 0.4
          rule_id: llm-extra
          severity: LOW
          cwe: CWE-613
          title: "Locked account keeps access: user state not re-checked"
          owasp_category: "A07:2021-Identification-and-Authentication-Failures"
          verdict_reason: "The filter loads the user from the repository on every request and authenticates only when !user.isLocked()."
