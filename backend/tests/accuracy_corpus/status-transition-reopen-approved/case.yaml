id: status-transition-reopen-approved
area: auth-logic
polarity: positive
seed_findings: []
adjudication: dev_label_only
# approve() and reject() guard on PENDING, but reopen() writes PENDING unconditionally, so a terminal APPROVED registration can be reopened and decided again.
# The scripted answer is what a reviewer expects a model to say, so this case pins the pipeline
# (publish, filters, validators, grouping), not a model's recall.
state_overrides:
  deep_scan_batch_small_files: false
expected:
  - rule_id: llm-extra
    cwe: CWE-841
    file: src/main/java/com/acme/service/RegistrationService.java
    sink_line: 22
    verdict: true_positive
scripted:
  - step: scan_deep_files
    when_user_contains: ["RegistrationService.java"]
    response:
      findings:
        - line: 22
          file: src/main/java/com/acme/service/RegistrationService.java
          verdict: true_positive
          confidence: 0.8
          rule_id: llm-extra
          severity: HIGH
          cwe: CWE-841
          title: "Approved registration can be reopened: no transition guard"
          owasp_category: "A04:2021-Insecure-Design"
          source: "caller of reopen()"
          sink: "registration.setStatus(Status.PENDING)"
          data_flow: "approve() and reject() require PENDING, but reopen() overwrites the status unconditionally, so an APPROVED or REJECTED registration goes back to PENDING and can be decided again"
          snippet: "registration.setStatus(Status.PENDING)"
          verdict_reason: "reopen() sets PENDING without comparing the stored status, unlike approve() and reject(); a decided registration can be re-opened and re-decided."
          ai_fix: "Allow reopen only from REJECTED (an explicit transition table) and compare the stored status before writing."
