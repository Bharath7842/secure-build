id: account-state-locked-user-kept
area: auth-logic
polarity: positive
seed_findings: []
adjudication: dev_label_only
# The filter authenticates from the session token alone. User declares a locked flag but the request path never loads the user and checks it, so a locked user keeps access until the token expires.
# The scripted answer is what a reviewer expects a model to say, so this case pins the pipeline
# (publish, filters, validators, grouping), not a model's recall.
state_overrides:
  deep_scan_batch_small_files: false
expected:
  - rule_id: llm-extra
    cwe: CWE-613
    file: src/main/java/com/acme/security/SessionAuthFilter.java
    sink_line: 21
    verdict: true_positive
scripted:
  - step: scan_deep_files
    when_user_contains: ["SessionAuthFilter.java"]
    response:
      findings:
        - line: 21
          file: src/main/java/com/acme/security/SessionAuthFilter.java
          verdict: true_positive
          confidence: 0.8
          rule_id: llm-extra
          severity: HIGH
          cwe: CWE-613
          title: "Locked account keeps access: user state not re-checked"
          owasp_category: "A07:2021-Identification-and-Authentication-Failures"
          source: "X-Session-Token header"
          sink: "setAuthentication(...)"
          data_flow: "the principal is built from the token alone; the user is never loaded, so User.isLocked() is never consulted and a locked user stays authenticated until the token expires"
          snippet: "setAuthentication(...)"
          verdict_reason: "The filter authenticates from the token and never loads the user to check the locked flag that User declares, so locking an account does not end its access."
          ai_fix: "Load the user on each request (or on refresh) and reject it when isLocked()/!isEnabled()."
