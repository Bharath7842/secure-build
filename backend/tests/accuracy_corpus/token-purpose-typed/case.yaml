id: token-purpose-typed
area: auth-logic
polarity: negative
seed_findings: []
adjudication: dev_label_only
# Look-alike of token-purpose-refresh-as-access: tokens carry a token_use claim and the filter validates through accessSubject(), which rejects a refresh token.
# The scripted answer is what a reviewer expects a model to say, so this case pins the pipeline
# (publish, filters, validators, grouping), not a model's recall.
state_overrides:
  deep_scan_batch_small_files: false
expected:
  - rule_id: llm-extra
    cwe: CWE-345
    file: src/main/java/com/acme/security/JwtAuthFilter.java
    sink_line: 21
    verdict: false_positive
scripted:
  - step: scan_deep_files
    when_user_contains: ["JwtAuthFilter.java"]
    response:
      findings:
        - line: 21
          file: src/main/java/com/acme/security/JwtAuthFilter.java
          verdict: false_positive
          confidence: 0.4
          rule_id: llm-extra
          severity: LOW
          cwe: CWE-345
          title: "Refresh token accepted as an access token"
          owasp_category: "A07:2021-Identification-and-Authentication-Failures"
          verdict_reason: "Every token carries a token_use claim and accessSubject() rejects anything that is not \"access\", so a refresh token cannot authenticate an API call."
