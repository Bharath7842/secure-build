id: OPENAPI.HTTP_SERVER
name: "OpenAPI specification lists an HTTP (non-HTTPS) server URL"
description: "HTTP server URLs allow plaintext transmission of API credentials and data."
severity: HIGH
category: ENCRYPTION_IN_TRANSIT
finding_type: MISCONFIGURATION
iac_type: openapi
provider: openapi
enabled: true
version: 1.0.0
remediation: >
  Replace http:// with https:// in all server URLs in the OpenAPI specification.
references:
  - https://swagger.io/docs/specification/api-host-and-base-path/
compliance:
  - framework: NIST_800_53
    control: "SC-8"
  - framework: OWASP_API
    control: "API7"
