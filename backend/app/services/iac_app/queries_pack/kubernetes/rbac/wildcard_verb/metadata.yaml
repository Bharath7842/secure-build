id: K8S.RBAC.WILDCARD_VERB
name: "RBAC role grants wildcard verb (*) permission"
description: "Using * as a verb in an RBAC rule grants all actions (get, list, create, update, delete, etc.)."
severity: HIGH
category: ACCESS_CONTROL
finding_type: MISCONFIGURATION
iac_type: kubernetes
provider: kubernetes
enabled: true
version: 1.0.0
remediation: >
  Replace wildcard verbs with the specific actions required by each workload.
references:
  - https://kubernetes.io/docs/reference/access-authn-authz/rbac/
compliance:
  - framework: CIS_K8S
    control: "5.1.3"
  - framework: NIST_800_53
    control: "AC-6"
