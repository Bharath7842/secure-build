id: K8S.RBAC.WILDCARD_RESOURCE
name: "RBAC Role or ClusterRole grants access to wildcard resources (*)"
description: "A wildcard resource grants access to every resource type in the matched API group, violating least privilege."
severity: HIGH
category: ACCESS_CONTROL
finding_type: MISCONFIGURATION
iac_type: kubernetes
provider: kubernetes
enabled: true
version: 1.0.0
remediation: >
  Replace resources: ["*"] with the specific resource types the role actually needs.
references:
  - https://kubernetes.io/docs/reference/access-authn-authz/rbac/
compliance:
  - framework: CIS_K8S
    control: "5.1.3"
  - framework: NIST_800_53
    control: "AC-6"
