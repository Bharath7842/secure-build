id: K8S.RBAC.WILDCARD_RESOURCE
name: "RBAC role grants access to all resources (*)"
description: "Using * as a resource in an RBAC rule grants access to every resource type in the API group."
severity: HIGH
category: ACCESS_CONTROL
finding_type: MISCONFIGURATION
iac_type: kubernetes
provider: kubernetes
enabled: true
version: 1.0.0
remediation: >
  Replace wildcard resources with the specific resource types required by each workload.
references:
  - https://kubernetes.io/docs/reference/access-authn-authz/rbac/
compliance:
  - framework: CIS_K8S
    control: "5.1.3"
  - framework: NIST_800_53
    control: "AC-6"
