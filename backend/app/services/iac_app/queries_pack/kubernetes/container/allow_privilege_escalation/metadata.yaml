id: K8S.CONTAINER.ALLOW_PRIVILEGE_ESCALATION
name: "Container allows privilege escalation"
description: "Without allowPrivilegeEscalation: false, a process inside the container can gain more privileges than its parent, potentially escaping to root."
severity: HIGH
category: CONTAINER_SECURITY
finding_type: MISCONFIGURATION
iac_type: kubernetes
provider: kubernetes
enabled: true
version: 1.0.0
remediation: >
  Set securityContext.allowPrivilegeEscalation: false on each container.
references:
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/
compliance:
  - framework: CIS_K8S
    control: "5.2.5"
  - framework: NIST_800_53
    control: "AC-6"
