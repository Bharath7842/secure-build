id: AWS.S3.PUBLIC_ACCESS_BLOCK_INCOMPLETE
name: "S3 public access block does not set all four flags to true"
description: "The aws_s3_bucket_public_access_block resource has one or more flags set to false."
severity: HIGH
category: DATA_PROTECTION
finding_type: MISCONFIGURATION
iac_type: terraform
provider: aws
enabled: true
version: 1.0.0
remediation: >
  Set block_public_acls, block_public_policy, ignore_public_acls, and restrict_public_buckets all to true.
references:
  - https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
compliance:
  - framework: CIS_AWS
    control: "2.1.5"
  - framework: NIST_800_53
    control: "SC-7"
