id: TF.AWS.GLUE.DATA_CATALOG_NOT_ENCRYPTED
name: "Glue data catalog encryption is not enabled"
description: "The AWS Glue data catalog does not have encryption at rest enabled for the metadata store."
severity: MEDIUM
category: ENCRYPTION
finding_type: MISCONFIGURATION
iac_type: terraform
provider: aws
enabled: true
version: 1.0.0
remediation: >
  In the aws_glue_data_catalog_encryption_settings resource, set
  encryption_at_rest.catalog_encryption_mode to "SSE-KMS".
references:
  - https://docs.aws.amazon.com/glue/latest/dg/encrypt-glue-data-catalog.html
compliance:
  - framework: NIST_800_53
    control: "SC-28"
