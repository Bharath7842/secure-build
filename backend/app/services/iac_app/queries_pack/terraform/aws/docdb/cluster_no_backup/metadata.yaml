id: TF.AWS.DOCDB.CLUSTER_NO_BACKUP
name: "DocumentDB cluster has no backup retention configured"
description: "The DocumentDB cluster backup retention period is not set or is zero, risking data loss."
severity: MEDIUM
category: RESILIENCE
finding_type: MISCONFIGURATION
iac_type: terraform
provider: aws
enabled: true
version: 1.0.0
remediation: >
  Set backup_retention_period to a value >= 1 in the aws_docdb_cluster resource.
references:
  - https://docs.aws.amazon.com/documentdb/latest/developerguide/backup-restore.db-cluster.html
compliance:
  - framework: NIST_800_53
    control: "CP-9"
