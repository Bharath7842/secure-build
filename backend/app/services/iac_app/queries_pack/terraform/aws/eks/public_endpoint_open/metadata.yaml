id: AWS.EKS.PUBLIC_ENDPOINT_OPEN
name: "EKS cluster API endpoint is public and open to all IP addresses"
description: "The EKS cluster has endpoint_public_access = true with no IP restrictions."
severity: HIGH
category: NETWORK_SECURITY
finding_type: MISCONFIGURATION
iac_type: terraform
provider: aws
enabled: true
version: 1.0.0
remediation: >
  Set public_access_cidrs to specific CIDR ranges or disable endpoint_public_access entirely.
references:
  - https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html
compliance:
  - framework: CIS_EKS
    control: "5.4.1"
  - framework: NIST_800_53
    control: "SC-7"
