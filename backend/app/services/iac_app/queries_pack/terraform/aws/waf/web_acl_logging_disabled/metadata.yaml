id: TF.AWS.WAF.WEB_ACL_LOGGING_DISABLED
name: "WAFv2 web ACL does not have logging enabled"
description: "The WAFv2 web ACL does not have logging configured, losing visibility into blocked and allowed requests."
severity: MEDIUM
category: LOGGING
finding_type: MISCONFIGURATION
iac_type: terraform
provider: aws
enabled: true
version: 1.0.0
remediation: >
  Add an aws_wafv2_web_acl_logging_configuration resource pointing to a Kinesis
  Firehose or CloudWatch log group.
references:
  - https://docs.aws.amazon.com/waf/latest/developerguide/logging.html
compliance:
  - framework: NIST_800_53
    control: "AU-2"
