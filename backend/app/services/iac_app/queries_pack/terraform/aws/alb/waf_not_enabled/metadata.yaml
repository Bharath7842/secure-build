id: TF.AWS.ALB.WAF_NOT_ENABLED
name: "ALB does not have WAF enabled"
description: "The Application Load Balancer does not have an AWS WAF web ACL associated, leaving it unprotected against common web attacks."
severity: MEDIUM
category: NETWORK
finding_type: MISCONFIGURATION
iac_type: terraform
provider: aws
enabled: true
version: 1.0.0
remediation: >
  Associate a WAF web ACL with the ALB using an aws_wafv2_web_acl_association resource,
  referencing the ALB ARN.
references:
  - https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html
compliance:
  - framework: NIST_800_53
    control: "SC-7"
