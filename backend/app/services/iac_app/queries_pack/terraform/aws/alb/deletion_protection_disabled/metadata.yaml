id: TF.AWS.ALB.DELETION_PROTECTION_DISABLED
name: "ALB deletion protection is disabled"
description: "The Application Load Balancer does not have deletion protection enabled, allowing accidental deletion."
severity: LOW
category: RESILIENCE
finding_type: MISCONFIGURATION
iac_type: terraform
provider: aws
enabled: true
version: 1.0.0
remediation: >
  Set enable_deletion_protection = true in the aws_lb or aws_alb resource.
references:
  - https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html
compliance:
  - framework: NIST_800_53
    control: "CP-10"
