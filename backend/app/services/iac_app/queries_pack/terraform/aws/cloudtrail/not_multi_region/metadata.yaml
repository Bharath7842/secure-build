id: AWS.CT.NOT_MULTI_REGION
name: "CloudTrail trail is not multi-region"
description: "A single-region trail misses API calls made in other AWS regions."
severity: MEDIUM
category: LOGGING
finding_type: MISCONFIGURATION
iac_type: terraform
provider: aws
enabled: true
version: 1.0.0
remediation: >
  Set is_multi_region_trail = true in your aws_cloudtrail resource.
references:
  - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/receive-cloudtrail-log-files-from-multiple-regions.html
compliance:
  - framework: CIS_AWS
    control: "3.1"
  - framework: NIST_800_53
    control: "AU-2"
