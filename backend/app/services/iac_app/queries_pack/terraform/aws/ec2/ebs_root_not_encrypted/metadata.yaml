id: AWS.EC2.EBS_ROOT_NOT_ENCRYPTED
name: "EC2 instance root EBS volume is not encrypted"
description: "The root_block_device does not have encrypted = true, exposing data at rest."
severity: MEDIUM
category: DATA_PROTECTION
finding_type: MISCONFIGURATION
iac_type: terraform
provider: aws
enabled: true
version: 1.0.0
remediation: >
  Add root_block_device { encrypted = true } to your aws_instance resource.
references:
  - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EBSEncryption.html
compliance:
  - framework: CIS_AWS
    control: "2.2.1"
  - framework: NIST_800_53
    control: "SC-28"
