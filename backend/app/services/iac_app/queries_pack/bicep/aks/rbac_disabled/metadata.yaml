id: BICEP.AKS.RBAC_DISABLED
name: "Bicep AKS cluster has RBAC disabled"
description: "Without RBAC, all identities have unrestricted cluster access, violating least-privilege."
severity: HIGH
category: ACCESS_CONTROL
finding_type: MISCONFIGURATION
iac_type: bicep
provider: azure
enabled: true
version: 1.0.0
remediation: >
  Set enableRBAC: true in Microsoft.ContainerService/managedClusters properties.
references:
  - https://docs.microsoft.com/en-us/azure/aks/manage-azure-rbac
compliance:
  - framework: CIS_AZURE
    control: "8.5"
  - framework: NIST_800_53
    control: "AC-6"
