- id: dast-xxe
  title: XML external entity injection (in-band)
  description: Supply a short XML document that declares an entity (an internal marker, or a file entity) and check
    whether the response contains the expanded text or a parser error that says the entity was loaded.
  owasp:
  - A05:2021
  wstg:
  - WSTG-INPV-07
  cwe:
  - CWE-611
  location: body
  signal:
  - xxe_entity_resolved
  severity: HIGH
  mode: automated
  remediation_ref: rem-xxe
  applies_to:
    locations:
    - body
    content_types:
    - application/xml
    - text/xml
- id: dast-hpp
  title: HTTP parameter pollution
  description: Send the same parameter twice, the second value a short distinct token, and check whether the response
    selects that second value.
  owasp:
  - A03:2021
  wstg:
  - WSTG-INPV-04
  cwe:
  - CWE-235
  location: query
  signal:
  - parameter_pollution_selected
  severity: MEDIUM
  mode: automated
  remediation_ref: rem-hpp
  applies_to:
    locations:
    - query
    - body
- id: dast-waf
  title: WAF or CDN detected
  description: Response headers or body match a known WAF or CDN signature. Informational; it changes how later
    findings should be read, it is not itself a vulnerability.
  owasp:
  - A05:2021
  wstg:
  - WSTG-INFO-02
  cwe:
  - CWE-200
  location: response
  signal:
  - waf_detected
  severity: INFO
  mode: automated
  remediation_ref: rem-waf
- id: dast-forced-browse
  title: Hidden path exposed
  description: A small bundled list of well-known sensitive paths answered with its own document rather than the
    site's normal page.
  owasp:
  - A01:2021
  wstg:
  - WSTG-CONF-04
  cwe:
  - CWE-538
  location: path
  signal:
  - hidden_path_exposed
  severity: MEDIUM
  mode: automated
  remediation_ref: rem-forced-browse
- id: dast-directory-listing
  title: Directory listing
  description: A response body is an index of files in a directory.
  owasp:
  - A05:2021
  wstg:
  - WSTG-CONF-04
  cwe:
  - CWE-548
  location: response
  signal:
  - directory_listed
  severity: MEDIUM
  mode: automated
  remediation_ref: rem-directory-listing
- id: dast-session-fixation
  title: Session fixation
  description: A session cookie set before login still has the same value after login.
  owasp:
  - A07:2021
  wstg:
  - WSTG-SESS-03
  cwe:
  - CWE-384
  location: header
  signal:
  - session_fixed
  severity: HIGH
  mode: automated
  remediation_ref: rem-session-fixation
- id: dast-session-timeout
  title: Excessive session lifetime
  description: A session cookie's expiry or Max-Age is longer than 24 hours.
  owasp:
  - A07:2021
  wstg:
  - WSTG-SESS-07
  cwe:
  - CWE-613
  location: header
  signal:
  - session_lifetime_excessive
  severity: LOW
  mode: automated
  remediation_ref: rem-session-timeout
- id: dast-credential-reuse
  title: Credential reuse across identities
  description: Two identities in this scan ended up holding the same session cookie value.
  owasp:
  - A07:2021
  wstg:
  - WSTG-SESS-01
  cwe:
  - CWE-287
  location: header
  signal:
  - credential_reused
  severity: HIGH
  mode: automated
  remediation_ref: rem-credential-reuse
- id: dast-graphql-introspection
  title: GraphQL introspection enabled
  description: The GraphQL endpoint returned its schema to an introspection query.
  owasp:
  - A05:2021
  apisec:
  - API9:2023
  wstg:
  - WSTG-INFO-08
  cwe:
  - CWE-200
  location: body
  signal:
  - graphql_introspection_enabled
  severity: LOW
  mode: automated
  remediation_ref: rem-graphql-introspection
- id: dast-graphql-batch
  title: GraphQL query batching
  description: The GraphQL endpoint accepted a JSON array of operations and returned a JSON array of results.
  owasp:
  - A04:2021
  apisec:
  - API4:2023
  cwe:
  - CWE-770
  location: body
  signal:
  - graphql_batch_accepted
  severity: LOW
  mode: automated
  remediation_ref: rem-graphql-batch
- id: dast-request-smuggling
  title: Ambiguous request framing
  description: One request carrying both Content-Length and Transfer-Encoding was accepted with a success status.
    Off unless enabled. The probe does not prefix a second request onto the connection.
  owasp:
  - A05:2021
  wstg:
  - WSTG-INPV-16
  cwe:
  - CWE-444
  location: header
  signal:
  - ambiguous_request_framing
  severity: HIGH
  mode: opt-in
  remediation_ref: rem-request-smuggling
  enabled: false
- id: dast-prototype-pollution
  title: Prototype pollution
  description: Supply a JSON object that sets __proto__ or constructor.prototype and check whether a new key from
    that object appears on the parsed response.
  owasp:
  - A03:2021
  wstg:
  - WSTG-CLNT-08
  cwe:
  - CWE-1321
  location: body
  signal:
  - prototype_pollution_applied
  severity: HIGH
  mode: automated
  remediation_ref: rem-prototype-pollution
  applies_to:
    locations:
    - body
    content_types:
    - application/json
- id: dast-postmessage
  title: postMessage without an origin check
  description: A fetched script registers a message listener and the following code does not read event.origin.
  owasp:
  - A05:2021
  wstg:
  - WSTG-CLNT-11
  cwe:
  - CWE-346
  location: response
  signal:
  - postmessage_origin_missing
  severity: MEDIUM
  mode: automated
  remediation_ref: rem-postmessage

- id: dast-jwt-alg-none
  title: JWT unsigned algorithm accepted
  description: An unsigned JWT is accepted on an observed authenticated read while the anonymous control is denied.
  owasp: ["A02:2021", "A07:2021"]
  apisec: ["API2:2023"]
  wstg: [WSTG-SESS-10]
  cwe: [CWE-347]
  location: header
  signal: [jwt_alg_none_accepted]
  severity: CRITICAL
  mode: automated
  remediation_ref: rem-jwt-alg-none
- id: dast-jwt-weak-secret
  title: JWT signed with a public tutorial secret
  description: A signature matches one of five public documentation secrets and a modified signed token is accepted.
  owasp: ["A02:2021", "A07:2021"]
  apisec: ["API2:2023"]
  wstg: [WSTG-SESS-10]
  cwe: [CWE-326, CWE-347]
  location: header
  signal: [jwt_weak_secret_accepted]
  severity: CRITICAL
  mode: opt-in
  remediation_ref: rem-jwt-weak-secret
- id: dast-jwt-missing-claims
  title: JWT accepted without required claims
  description: A modified JWT without exp, iss or aud is accepted on an authenticated read; structural absence alone is not proof.
  owasp: ["A07:2021"]
  apisec: ["API2:2023"]
  wstg: [WSTG-SESS-10]
  cwe: [CWE-345]
  location: header
  signal: [jwt_missing_claims_accepted]
  severity: MEDIUM
  mode: automated
  remediation_ref: rem-jwt-missing-claims
