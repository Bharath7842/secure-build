# DAST check catalog (DAST-03-010 / -020 / -030).
# A check is data: identity, standards, where to inject, which detector signals prove it, severity,
# mode, remediation and dependencies. It never carries a payload; the model builds inputs at scan
# time. Validated at load by app/dast/domain/catalog.py (unknown fields are errors).
- id: dast-bola
  title: Broken object level authorization (BOLA)
  description: Request another object's id, or replay as another identity; a success where denial was expected proves
    the flaw.
  owasp:
  - A01:2021
  apisec:
  - API1:2023
  wstg:
  - WSTG-ATHZ-04
  cwe:
  - CWE-639
  location: path
  signal:
  - auth_boundary_crossed
  severity: HIGH
  mode: automated
  remediation_ref: rem-bola
  aliases:
  - dast-authz
  dependencies:
    second_identity: degrade
  degraded_note: no-session replay only
  applies_to:
    locations:
    - path
    - query
    - body
    needs_object_id: true
- id: dast-authn
  title: Broken authentication
  description: Replay an authenticated request with no session or an invalid token; success proves an authentication
    gap.
  owasp:
  - A07:2021
  apisec:
  - API2:2023
  wstg:
  - WSTG-ATHN-04
  cwe:
  - CWE-287
  location: header
  signal:
  - auth_boundary_crossed
  severity: HIGH
  mode: automated
  remediation_ref: rem-authn
- id: dast-mass-assignment
  title: Mass assignment (broken object property level authorization)
  description: Add properties the client never sends and see whether the server accepts and acts on them.
  owasp:
  - A01:2021
  apisec:
  - API3:2023
  cwe:
  - CWE-915
  location: body
  signal:
  - status_length_divergence
  severity: MEDIUM
  mode: automated
  remediation_ref: rem-mass-assignment
  dependencies:
    schema: degrade
  degraded_note: on observed properties only
  applies_to:
    locations:
    - body
    methods:
    - POST
    - PUT
    - PATCH
- id: dast-excessive-data
  title: Excessive data exposure
  description: Responses carry more fields than the operation needs, including sensitive ones.
  owasp:
  - A01:2021
  apisec:
  - API3:2023
  wstg:
  - WSTG-INFO-05
  cwe:
  - CWE-213
  location: response
  signal:
  - sensitive_data_exposed
  severity: MEDIUM
  mode: automated
  remediation_ref: rem-excessive-data
  passive: true
- id: dast-resource-consumption
  title: Unrestricted resource consumption
  description: Probe for missing rate and size limits. Generates load, so it is off until explicitly enabled.
  owasp:
  - A04:2021
  apisec:
  - API4:2023
  wstg:
  - WSTG-BUSL-05
  cwe:
  - CWE-770
  location: query
  signal:
  - time_delta
  - status_length_divergence
  severity: MEDIUM
  mode: opt-in
  remediation_ref: rem-resource-consumption
  load_generating: true
  enabled: false
- id: dast-bfla
  title: Broken function level authorization (BFLA)
  description: Call a privileged function as a lower-privilege or anonymous identity; success proves the flaw.
  owasp:
  - A01:2021
  apisec:
  - API5:2023
  wstg:
  - WSTG-ATHZ-02
  cwe:
  - CWE-285
  location: header
  signal:
  - auth_boundary_crossed
  severity: HIGH
  mode: automated
  remediation_ref: rem-bfla
  dependencies:
    second_identity: degrade
  degraded_note: anonymous replay only
- id: dast-business-flows
  title: Unrestricted access to sensitive business flows
  description: Surface sensitive flows (checkout, invite, password reset) for human review. Flow abuse is business
    logic.
  owasp:
  - A04:2021
  apisec:
  - API6:2023
  wstg:
  - WSTG-BUSL-06
  cwe:
  - CWE-840
  location: response
  signal: []
  severity: MEDIUM
  mode: assist-only
  remediation_ref: rem-business-flows
- id: dast-ssrf
  title: Server-side request forgery (SSRF)
  description: Supply an out-of-band address in URL-accepting parameters; a received callback is unambiguous proof.
  owasp:
  - A10:2021
  apisec:
  - API7:2023
  wstg:
  - WSTG-INPV-19
  cwe:
  - CWE-918
  location: query
  signal:
  - oast_callback_received
  severity: HIGH
  mode: automated
  remediation_ref: rem-ssrf
  dependencies:
    oast: assist-only
  applies_to:
    locations:
    - query
    - body
    param_types:
    - url
- id: dast-misconfig
  title: Security misconfiguration
  description: The target advertises dangerous HTTP methods (TRACE, PUT, DELETE, CONNECT) in the Allow header of an
    OPTIONS response on the scan root. Header findings stay on the dedicated passive checks.
  owasp:
  - A05:2021
  apisec:
  - API8:2023
  wstg:
  - WSTG-CONF-07
  cwe:
  - CWE-16
  location: header
  signal:
  - dangerous_method_accepted
  severity: MEDIUM
  mode: automated
  remediation_ref: rem-misconfig
- id: dast-api-inventory
  title: Improper inventory management
  description: Endpoints that exist but are not documented in the API schema (shadow, old-version and debug endpoints).
  owasp:
  - A05:2021
  apisec:
  - API9:2023
  wstg:
  - WSTG-INFO-06
  cwe:
  - CWE-1059
  location: response
  signal:
  - undocumented_endpoint
  severity: LOW
  mode: automated
  remediation_ref: rem-api-inventory
  passive: true
  dependencies:
    schema: skip
- id: dast-unsafe-consumption
  title: Unsafe consumption of APIs
  description: Trust placed in upstream third-party APIs is largely invisible from outside; flagged for human review.
  owasp:
  - A08:2021
  apisec:
  - API10:2023
  cwe:
  - CWE-1357
  location: response
  signal: []
  severity: LOW
  mode: assist-only
  remediation_ref: rem-unsafe-consumption
- id: dast-sqli
  title: SQL injection
  description: 'Input reaches a database query unsanitized: a data-layer error surfaces, or behaviour diverges between
    true and false variants.'
  owasp:
  - A03:2021
  wstg:
  - WSTG-INPV-05
  cwe:
  - CWE-89
  location: query
  signal:
  - db_error_surfaced
  - boolean_divergence
  - time_delta
  severity: HIGH
  mode: automated
  remediation_ref: rem-sqli
  applies_to:
    locations:
    - query
    - body
    - path
    param_types:
    - string
    - number
- id: dast-xss
  title: Cross-site scripting (reflected)
  description: Supplied markup comes back unescaped in a response that browsers render.
  owasp:
  - A03:2021
  wstg:
  - WSTG-INPV-01
  cwe:
  - CWE-79
  location: query
  signal:
  - input_reflected_unescaped
  - marker_executed_in_browser
  severity: MEDIUM
  mode: automated
  remediation_ref: rem-xss
  applies_to:
    locations:
    - query
    - body
    - path
    content_types:
    - text/html
- id: dast-xss-dom
  title: Cross-site scripting (DOM)
  description: Client-side code sends a page input to a markup sink, and the marker runs in the browser.
  owasp:
  - A03:2021
  wstg:
  - WSTG-CLNT-01
  cwe:
  - CWE-79
  location: query
  signal:
  - marker_executed_in_browser
  - marker_reaches_dom_sink
  severity: MEDIUM
  mode: automated
  remediation_ref: rem-xss-dom
  applies_to:
    locations:
    - query
    content_types:
    - text/html
- id: dast-xss-stored
  title: Cross-site scripting (stored)
  description: A submitted marker is stored and later rendered as live markup. Opt-in, and only against a disposable target.
  wstg:
  - WSTG-INPV-02
  cwe:
  - CWE-79
  location: body
  signal:
  - marker_executed_in_browser
  - marker_persisted_unescaped
  severity: HIGH
  mode: opt-in
  remediation_ref: rem-xss-stored
  applies_to:
    locations:
    - body
    content_types:
    - text/html
- id: dast-cmdi
  title: OS command injection
  description: 'Input reaches a shell: command output appears in the response or the response is measurably delayed.'
  owasp:
  - A03:2021
  wstg:
  - WSTG-INPV-12
  cwe:
  - CWE-78
  location: query
  signal:
  - command_output_marker
