  apisec:
  - API8:2023
  wstg:
  - WSTG-CLNT-07
  cwe:
  - CWE-942
  location: header
  signal:
  - cors_permissive
  severity: MEDIUM
  mode: automated
  remediation_ref: rem-cors
  passive: true
- id: dast-passive-tech-disclosure
