  - A05:2021
  apisec:
  - API8:2023
  wstg:
  - WSTG-INFO-02
  cwe:
  - CWE-200
  location: header
  signal:
  - technology_disclosed
  severity: LOW
  mode: automated
  remediation_ref: rem-tech-disclosure
  passive: true
- id: dast-passive-verbose-errors
