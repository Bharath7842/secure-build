  - WSTG-ERRH-02
  cwe:
  - CWE-209
  location: response
  signal:
  - verbose_error_exposed
  severity: MEDIUM
  mode: automated
  remediation_ref: rem-verbose-errors
  passive: true
- id: dast-path-traversal
  title: Path traversal / local file inclusion
  description: Supply a relative-path payload (e.g. ../../../../etc/passwd) in a file or path parameter and check whether
    the response contains the target file's content rather than the normal page.
  owasp:
  - A01:2021
  wstg:
  - WSTG-ATHZ-01
  cwe:
  - CWE-22
  location: query
  signal:
  - file_disclosure_marker
  severity: HIGH
  mode: automated
  remediation_ref: rem-path-traversal
  applies_to:
    locations:
    - query
    - body
    - path
- id: dast-ssti
  title: Server-side template injection (SSTI)
  description: 'Supply a template expression such as {{7*7}}, ${7*7}, #{7*7}, <%= 7*7 %> or @(7*7) and check whether the
    evaluated product (e.g. 49) appears in the response rather than the literal expression.'
  owasp:
  - A03:2021
  wstg:
  - WSTG-INPV-18
  cwe:
  - CWE-1336
  location: query
  signal:
  - template_expression_evaluated
  severity: CRITICAL
  mode: automated
  remediation_ref: rem-ssti
- id: dast-open-redirect
  title: Open redirect
  description: Supply an absolute, off-site URL (e.g. https://evil.example.com or //evil.example.com) in a redirect-target
    parameter and check whether the response redirects the browser there.
  owasp:
  - A01:2021
  wstg:
  - WSTG-CLNT-04
  cwe:
  - CWE-601
  location: query
  signal:
  - open_redirect_location
  severity: MEDIUM
  mode: automated
  remediation_ref: rem-open-redirect
- id: dast-csrf
  title: Cross-site request forgery (CSRF)
  description: On a state-changing request, replace or remove the anti-CSRF token parameter or header and check whether
    the request still succeeds as if the token had been valid.
  owasp:
  - A01:2021
  wstg:
  - WSTG-SESS-05
  cwe:
  - CWE-352
  location: body
  signal:
  - csrf_not_enforced
  severity: HIGH
  mode: automated
  remediation_ref: rem-csrf
  applies_to:
    methods:
    - POST
    - PUT
    - PATCH
    - DELETE
- id: dast-nosqli
  title: NoSQL injection
  description: Supply an operator-shaped value (e.g. a JSON object with $ne or $where) where a plain string or number
    is expected, and check for a store error or a true/false behaviour divergence.
  owasp:
  - A03:2021
  wstg:
  - WSTG-INPV-05
  cwe:
  - CWE-943
  location: body
  signal:
  - nosql_error_surfaced
  - boolean_divergence
  severity: HIGH
  mode: automated
  remediation_ref: rem-nosqli
  applies_to:
    locations:
    - query
    - body
- id: dast-ldapi
  title: LDAP injection
  description: Supply an LDAP filter metacharacter (e.g. *)(uid=*)) in a parameter the directory search uses, and check
    for a directory error or a true/false behaviour divergence.
  owasp:
  - A03:2021
  wstg:
  - WSTG-INPV-06
  cwe:
  - CWE-90
  location: query
  signal:
  - ldap_error_surfaced
  - boolean_divergence
  severity: HIGH
  mode: automated
  remediation_ref: rem-ldapi
- id: dast-xpathi
  title: XPath injection
  description: Supply an XPath metacharacter (e.g. ' or '1'='1) in a parameter an XPath query uses, and check for an XML
    engine error or a true/false behaviour divergence.
  owasp:
  - A03:2021
  wstg:
  - WSTG-INPV-09
  cwe:
  - CWE-643
  location: query
  signal:
  - xpath_error_surfaced
  - boolean_divergence
  severity: MEDIUM
  mode: automated
  remediation_ref: rem-xpathi
- id: dast-ssi
  title: Server-side includes (SSI) injection
  description: Supply an SSI exec directive (e.g. <!--#exec cmd="id"-->) and check whether the response contains the
